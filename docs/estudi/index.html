<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RiftMate Macro</title>
<meta name="theme-color" content="#0e1618">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one column like a phone app; a header with the link to your PC, the content, and tabs at the bottom.
   Colors: the RiftMate dark teal with a gold for titles (the app's banner), a light version for daylight. */
:root{
  --bg:#f4f6f5; --card:#ffffff; --fg:#14201f; --muted:#5d6b69; --line:#dbe3e1;
  --accent:#137a6b; --gold:#9a7a2c; --good:#1d7f4e; --bad:#b4442e; --chip:#e8efed;
  --display:"Barlow Condensed", "Arial Narrow", system-ui, sans-serif; --body:Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0e1618; --card:#152124; --fg:#e6efed; --muted:#93a5a2; --line:#24363a;
  --accent:#3cc4ae; --gold:#d6b25e; --good:#4fc98a; --bad:#ef7a62; --chip:#1c2c30; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--body)}
body{padding:env(safe-area-inset-top,0) max(16px,env(safe-area-inset-right,0px)) calc(76px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--display);letter-spacing:.02em;margin:0;text-wrap:balance}
h1{font-size:1.35rem;white-space:nowrap;color:var(--gold);text-transform:uppercase}
h2{font-size:1.35rem}
h3{font-size:1.05rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:18px}
p{margin:.4em 0}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 10px}
header .link{font-size:.8rem;color:var(--muted);text-align:right;background:none;border:0;padding:0;font:inherit;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
.note{color:var(--muted);font-size:.85rem}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:2px 10px;font-size:.8rem;color:var(--muted)}
.btn{appearance:none;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:10px;padding:10px 16px;font:600 .95rem var(--body);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:focus-visible,.opt:focus-visible,nav button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);text-transform:uppercase;letter-spacing:.15em;width:11em}
.lesson{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;color:inherit;font:inherit;cursor:pointer}
.lesson b{display:block;font-family:var(--display);font-size:1.15rem;letter-spacing:.02em}
.lesson .meter{margin-left:auto;flex:none;width:64px;text-align:right;display:block}.lesson .meter .bar{display:block}
.bar{height:6px;border-radius:3px;background:var(--chip);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--bad)}
.bar.ok i{background:var(--good)}
.mapbox{background:var(--chip);border-radius:12px;padding:6px;margin:10px 0}
.mapbox svg{display:block;width:100%;height:auto;max-width:360px;margin:0 auto}.mapbox.big svg{max-width:520px}.unit{transition:transform .9s ease,opacity .5s}.good{color:var(--good)}.bad{color:var(--bad)}
@media (prefers-reduced-motion: reduce){.unit{transition:none}}
ul.rules{padding-left:1.1em}ul.rules li{margin:.25em 0}
.ex{border-left:3px solid var(--bad);padding:4px 10px;margin:8px 0;font-size:.9rem}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:inherit;font:inherit;cursor:pointer}
.opt.right{border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good)}.opt.wrong{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.why{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--chip)}
.mine{color:var(--bad);font-weight:600;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--line);padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav button{flex:1;max-width:180px;background:none;border:0;color:var(--muted);font:600 .8rem var(--body);padding:8px 4px;border-radius:10px;cursor:pointer}
nav button[aria-selected="true"]{color:var(--accent);background:var(--chip)}
table{width:100%;border-collapse:collapse;font-size:.9rem}td{padding:6px 4px;border-top:1px solid var(--line)}td.n{text-align:right;font-variant-numeric:tabular-nums}
.big{font-family:var(--display);font-size:2.2rem;line-height:1;color:var(--accent)}
.sources a{color:var(--muted)}
@media (prefers-reduced-motion: no-preference){.card,.lesson{transition:border-color .15s}}
</style>
</head>
<body>
<header><h1>RiftMate · Macro</h1><button class="link" id="linkBtn" type="button"></button></header>
<main id="view"></main>
<nav role="tablist">
  <button role="tab" id="tYou" type="button">Per a tu</button>
  <button role="tab" id="tLessons" type="button">Lliçons</button>
  <button role="tab" id="tPlays" type="button">Jugades</button>
  <button role="tab" id="tQuiz" type="button">Preguntes</button>
</nav>
<script src="content.js"></script>
<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const get = (k, d) => { try { const v = localStorage.getItem("rm." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const put = (k, v) => { try { localStorage.setItem("rm." + k, JSON.stringify(v)); } catch (e) {} };
const GAME_KINDS = ["farm", "kp", "llencat", "objs"];
const LBY = Object.fromEntries(LESSONS.map(l => [l.id, l]));

// ---- the link to your PC: a code shown in RiftMate (Coach › Estudia al mòbil). The PC sends a summary of your
// mistakes through ntfy.sh under that code; this page keeps the last one it got.
let code = (location.hash.slice(1).replace(/[^A-Za-z0-9]/g, "").toUpperCase() || get("code", "")).slice(0, 8);
// the code stays in the address: a home-screen icon made from this page (iPhone) then opens already linked
function keepCodeInURL(){ try { history.replaceState(null, "", location.pathname + (code.length === 8 ? "#" + code : "")); } catch (e) {} }
keepCodeInURL();

// ---- installing it as an app: Android Chrome offers a button; iPhone needs Share › Add to Home Screen; the
// browser inside the camera or other apps (where the QR opens) forgets everything when you leave
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const ua = navigator.userAgent, isIOS = /iPhone|iPad|iPod/.test(ua), inApp = /GSA\/|FBAN|FBAV|Instagram|Line\/|wv\)|; wv/.test(ua);
let installEvt = null;
addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; render(); });
addEventListener("appinstalled", () => { installEvt = null; put("installed", true); render(); });
function installCard(){
  if (standalone || get("installHide", false)) return "";
  const url = location.href;
  const how = installEvt ? `<button class="btn" id="installBtn" type="button">Instal·lar l'app</button>`
    : inApp ? `<p>Ara l'has obert dins d'una altra app (la càmera o el lector de QR), i quan en surts s'oblida de tot. Obre-la amb ${isIOS ? "<b>Safari</b>" : "<b>Chrome</b>"}: copia l'enllaç i enganxa'l al navegador.</p><p class="note" style="word-break:break-all">${esc(url)}</p><button class="btn ghost" id="copyUrl" type="button">Copiar l'enllaç</button>`
    : isIOS ? `<p>A Safari, prem <b>Compartir</b> (el quadrat amb la fletxa) i després <b>Afegeix a la pantalla d'inici</b>. Ja portarà el teu codi.</p>`
    : `<p>A Chrome, prem el menú <b>⋮</b> i després <b>Instal·la l'aplicació</b> (o <b>Afegeix a la pantalla d'inici</b>).</p>`;
  return `<section class="card"><h2>Posa-la a la pantalla d'inici</h2><p>Així s'obre com una app, amb el teu codi guardat, i funciona sense connexió.</p>${how}<p><button class="btn ghost" id="installHide" type="button">Ja ho he fet</button></p></section>`;
}
if (code.length === 8) put("code", code);
let prof = get("prof", null);
async function sync(){
  if (code.length !== 8) return;
  try {
    const r = await fetch(`https://ntfy.sh/riftmate-estudi-${code.toLowerCase()}/json?poll=1&since=all`, {cache: "no-store"});
    const lines = (await r.text()).trim().split("\n").filter(Boolean).map(l => { try { return JSON.parse(l); } catch (e) { return null; } }).filter(x => x?.event === "message");
    const last = lines[lines.length - 1]; if (!last) return;
    const p = JSON.parse(last.message); if (p?.v !== 1) return;
    if (!prof || p.at > prof.at) { prof = p; put("prof", p); render(); }
  } catch (e) { /* offline: the last summary stays */ }
}
function ago(t){ const m = Math.round((Date.now() / 1000 - t) / 60); return m < 60 ? `fa ${m} min` : m < 1440 ? `fa ${Math.round(m / 60)} h` : `fa ${Math.round(m / 1440)} dies`; }
function linkLabel(){ $("#linkBtn").textContent = prof ? `${prof.games} partides · ${ago(prof.at)}` : code.length === 8 ? "Esperant el PC…" : "Enllaçar amb el PC"; }

// ---- spaced review: each question in a box 0-4; right moves it up (back in 1, 3, 7, 21 days), wrong to box 0
const DAYS = [0, 1, 3, 7, 21];
let srs = get("srs", {});
function grade(id, ok){ const s = srs[id] || {b: 0, n: 0, w: 0}; s.n++; if (ok) s.b = Math.min(4, s.b + 1); else { s.b = 0; s.w++; } s.due = Date.now() + DAYS[s.b] * 864e5; srs[id] = s; put("srs", srs); }

// your questions: one per example from your games, plus the general ones
function allQuestions(){
  const mine = (prof?.ex || []).map((e, i) => { const t = PERSONAL[e.t]; if (!t) return null;
    const id = `p-${e.t}-${e.d}-${e.m}-${e.c}`;
    return {id, l: t.l, d: t.d || 2, q: t.q(e), o: t.o, a: 0, why: t.why, mine: true}; }).filter(Boolean);
  return mine.concat(QUESTIONS);
}
// how much each lesson matters for you: the PC's score (your mistakes) and how you answer here
function weight(l){ const s = prof?.score?.[l] ?? 30; return 1 + s / 25; }
// the level: 1 basic, 2 advanced, 3 expert. It moves by itself: 7 or 8 right goes up, 3 or less goes down
let lvl = get("lvl", 2);
const LVL_NAME = {1: "Bàsic", 2: "Avançat", 3: "Expert"};
const near = q => Math.abs((q.d || 1) - lvl);
function pickRound(n = 8, lesson = null){
  const qs = allQuestions().filter(q => (!lesson || q.l === lesson) && (q.d || 1) <= lvl), now = Date.now();
  const due = qs.filter(q => srs[q.id] && srs[q.id].due <= now && srs[q.id].b < 4).sort((a, b) => srs[a.id].b - srs[b.id].b);
  const fresh = qs.filter(q => !srs[q.id]).sort((a, b) => (near(a) - near(b)) || (b.mine - a.mine) || (weight(b.l) * Math.random() - weight(a.l) * Math.random()));
  const rest = qs.filter(q => srs[q.id] && srs[q.id].due > now).sort((a, b) => (near(a) - near(b)) || Math.random() - .5);
  const out = []; for (const q of [...due, ...fresh, ...rest]) { if (out.length >= n) break; if (!out.includes(q)) out.push(q); }
  return out;
}
function levelAfter(ok, n){
  if (n < 6) return "";
  if (ok >= n - 1 && lvl < 3) { lvl++; put("lvl", lvl); return `Massa fàcil: pugem a nivell <b>${LVL_NAME[lvl]}</b>.`; }
  if (ok <= n / 2 - 1 && lvl > 1) { lvl--; put("lvl", lvl); return `Baixem a nivell <b>${LVL_NAME[lvl]}</b> per assentar les bases.`; }
  return "";
}
const shuffle = q => { const idx = q.o.map((_, i) => i).sort(() => Math.random() - .5); return {...q, o: idx.map(i => q.o[i]), a: idx.indexOf(q.a)}; };

// ---- the map: a sketch of Summoner's Rift in 0-100 (your base bottom-left). Towers, river, pits and bases are
// where they are in the game, roughly; the lessons and the plays draw on top of it.
const SY = y => 100 - y;
const TOWERS = {b: [[8, 72], [8, 48], [8, 26], [38, 38], [30, 30], [22, 22], [72, 8], [48, 8], [26, 8]], r: [[28, 92], [52, 92], [74, 92], [62, 62], [70, 70], [78, 78], [92, 28], [92, 52], [92, 74]]};
function mapBase(){
  // in screen coordinates (y down): top lane up the left edge and along the top, bot lane along the bottom and up
  // the right edge, mid from your base to theirs, the river across the other diagonal
  return `<rect x="0" y="0" width="100" height="100" rx="5" fill="var(--card)"/>
    <path d="M14 14L86 86" stroke="var(--accent)" stroke-opacity=".14" stroke-width="11" stroke-linecap="round"/>
    <path d="M12 88L88 12" stroke="var(--line)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M8 96V8H96" fill="none" stroke="var(--line)" stroke-width="5" stroke-linejoin="round"/>
    <path d="M4 92H92V4" fill="none" stroke="var(--line)" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="6" cy="${SY(6)}" r="7" fill="var(--accent)" fill-opacity=".3"/><circle cx="94" cy="${SY(94)}" r="7" fill="var(--bad)" fill-opacity=".3"/>
    <circle cx="67" cy="${SY(33)}" r="4.2" fill="none" stroke="var(--muted)" stroke-dasharray="1 1"/><circle cx="33" cy="${SY(67)}" r="4.2" fill="none" stroke="var(--muted)" stroke-dasharray="1 1"/>
    ${TOWERS.b.map(([x, y]) => `<rect x="${x - 1.4}" y="${SY(y) - 1.4}" width="2.8" height="2.8" rx=".5" fill="var(--accent)"/>`).join("")}
    ${TOWERS.r.map(([x, y]) => `<rect x="${x - 1.4}" y="${SY(y) - 1.4}" width="2.8" height="2.8" rx=".5" fill="var(--bad)"/>`).join("")}
    <text x="14" y="${SY(1.5)}" font-size="3" fill="var(--muted)">la teva base</text>
    <defs><marker id="ahg" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--gold)"/></marker>
      <marker id="ahb" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--accent)"/></marker>
      <marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--bad)"/></marker>
      <clipPath id="cc"><circle cx="0" cy="0" r="2.75"/></clipPath></defs>`;
}
const lab = (x, y, t, dy = -3.2) => t ? `<text x="${x}" y="${SY(y) + dy}" text-anchor="middle" font-size="3.2" font-weight="600" fill="var(--fg)" paint-order="stroke" stroke="var(--card)" stroke-width=".8">${esc(t)}</text>` : "";
const wardSVG = (x, y) => `<path d="M${x} ${SY(y) - 2.2}l1.6 2.2-1.6 2.2-1.6-2.2z" fill="var(--gold)"/>`;
const arrowSVG = (x1, y1, x2, y2, c = "g") => `<line x1="${x1}" y1="${SY(y1)}" x2="${x2}" y2="${SY(y2)}" stroke="${c === "b" ? "var(--accent)" : c === "r" ? "var(--bad)" : "var(--gold)"}" stroke-width="1.1" ${c === "r" ? 'stroke-dasharray="2 1.2"' : ""} marker-end="url(#ah${c})"/>`;
function mapSVG(marks){
  let s = `<svg viewBox="-1 -1 102 102" role="img" aria-label="Esquema del mapa">${mapBase()}`;
  for (const m of marks || []) {
    if (m.k === "arrow") s += arrowSVG(m.x, m.y, m.x2, m.y2) + lab((m.x + m.x2) / 2, (m.y + m.y2) / 2, m.t);
    else if (m.k === "zone") s += `<circle cx="${m.x}" cy="${SY(m.y)}" r="${m.r}" fill="var(--gold)" fill-opacity=".22" stroke="var(--gold)" stroke-width=".5"/>` + lab(m.x, m.y + m.r, m.t, -1);
    else if (m.k === "ward") s += wardSVG(m.x, m.y);
    else s += `<circle cx="${m.x}" cy="${SY(m.y)}" r="1.6" fill="var(--fg)"/>` + lab(m.x, m.y, m.t);
  }
  return s + `</svg>`;
}

// ---- plays on the map: champions' faces (Riot's Data Dragon), waves, arrows and wards, step by step
let ddv = get("ddv", "14.24.1");
fetch("https://ddragon.leagueoflegends.com/api/versions.json").then(r => r.json()).then(v => { if (v?.[0]) { ddv = v[0]; put("ddv", ddv); } }).catch(() => {});
const DDID = {"LeBlanc": "Leblanc", "Wukong": "MonkeyKing", "Kai'Sa": "Kaisa", "Cho'Gath": "Chogath", "Vel'Koz": "Velkoz", "Kha'Zix": "Khazix", "Bel'Veth": "Belveth", "Renata Glasc": "Renata", "Nunu & Willump": "Nunu"};
const ddId = n => DDID[n] || String(n || "Ahri").replace(/[^A-Za-z]/g, "").replace(/^./, c => c.toUpperCase());
const champImg = c => `https://ddragon.leagueoflegends.com/cdn/${ddv}/img/champion/${ddId(c)}.png`;
let play = null; // {p, i, ans}
function playState(p, upto){
  const st = {u: {}, w: {}, o: [], a: [], wd: []};
  p.steps.slice(0, upto + 1).forEach((s, i) => {
    for (const [id, v] of Object.entries(s.u || {})) {
      if (v === "dead") st.u[id] = {...st.u[id], dead: true};
      else if (v.length === 4) st.u[id] = {c: v[0] === "@me" ? (prof?.champ || "Ahri") : v[0], t: v[1], x: v[2], y: v[3], me: id === "me"};
      else st.u[id] = {...st.u[id], x: v[0], y: v[1]};
    }
    for (const [id, v] of Object.entries(s.w || {})) st.w[id] = {t: v[0], x: v[1], y: v[2], n: v[3]};
    if (s.o) st.o = s.o;
    if (s.wd) st.wd = st.wd.concat(s.wd);
    st.a = i === upto ? (s.a || []) : [];
  });
  return st;
}
function playSVG(p){
  const st = playState(p, 0);
  return `<svg viewBox="-1 -1 102 102" role="img" aria-label="${esc(p.name)}" id="pmap">${mapBase()}<g id="pobj"></g><g id="pwd"></g><g id="pw"></g><g id="parr"></g>
    ${Object.entries(st.u).map(([id]) => `<g class="unit" id="u-${id}"></g>`).join("")}${p.steps.flatMap(s => Object.entries(s.u || {}).filter(([, v]) => Array.isArray(v) && v.length === 4)).map(([id]) => id).filter((id, i, a) => a.indexOf(id) === i && !st.u[id]).map(id => `<g class="unit" id="u-${id}"></g>`).join("")}</svg>`;
}
function playDraw(p, i){
  const st = playState(p, i), svg = $("#pmap"); if (!svg) return;
  svg.querySelector("#pobj").innerHTML = st.o.map(o => `<circle cx="${o.x}" cy="${SY(o.y)}" r="4.2" fill="var(--bad)" fill-opacity="${o.dead ? .1 : .3}" stroke="var(--bad)" stroke-width=".5"/>${lab(o.x, o.y, ({drac: "Drac", baro: "Baró", larves: "Larves", herald: "Herald"}[o.k] || o.k) + (o.t ? " " + o.t : ""), 7.5)}`).join("");
  svg.querySelector("#pwd").innerHTML = st.wd.map(([x, y]) => wardSVG(x, y)).join("");
  svg.querySelector("#pw").innerHTML = Object.values(st.w).filter(w => w.n > 0).map(w => { const c = w.t === "b" ? "var(--accent)" : "var(--bad)", k = Math.min(w.n, 15);
    return `<g transform="translate(${w.x} ${SY(w.y)})">${Array.from({length: k}, (_, j) => `<rect x="${(j % 5) * 1.5 - 3.6}" y="${Math.floor(j / 5) * 1.5 - 1.4}" width="1.2" height="1.2" fill="${c}"/>`).join("")}</g>`; }).join("");
  svg.querySelector("#parr").innerHTML = st.a.map(a => arrowSVG(...a)).join("");
  for (const [id, u] of Object.entries(st.u)) {
    const g = svg.querySelector("#u-" + id); if (!g) continue;
    if (!g.dataset.c) { g.dataset.c = u.c; const ring = u.me ? "var(--gold)" : u.t === "b" ? "var(--accent)" : "var(--bad)";
      g.innerHTML = `<circle r="3.3" fill="${ring}"/><circle r="2.75" fill="var(--chip)"/><text y="1" text-anchor="middle" font-size="2.6" fill="var(--fg)">${esc(u.c.slice(0, 2))}</text>
        <image href="${champImg(u.c)}" x="-2.75" y="-2.75" width="5.5" height="5.5" clip-path="url(#cc)" onerror="this.remove()"/>${u.me ? `<text y="-4.3" text-anchor="middle" font-size="2.8" font-weight="700" fill="var(--gold)" paint-order="stroke" stroke="var(--card)" stroke-width=".8">Tu</text>` : ""}
        <path class="x" d="M-2.6 -2.6L2.6 2.6M2.6 -2.6L-2.6 2.6" stroke="var(--bad)" stroke-width="1" opacity="0"/>`; }
    const first = !g.dataset.placed; g.dataset.placed = 1;
    if (first) g.style.transition = "none";
    g.style.transform = `translate(${u.x}px, ${SY(u.y)}px)`;
    if (first) { g.getBoundingClientRect(); g.style.transition = ""; }
    g.style.opacity = u.dead ? .35 : 1; g.querySelector(".x").setAttribute("opacity", u.dead ? 1 : 0);
  }
  const cap = $("#pcap"); if (cap) cap.textContent = p.steps[i].t;
  const pos = $("#ppos"); if (pos) pos.textContent = `${i + 1} de ${p.steps.length}`;
}
function viewPlays(){
  const done = get("playsDone", {});
  return `<section class="card"><h2>Jugades explicades</h2><p>Situacions de partida al mapa, amb les cares dels campions i fletxes. Primer decideixes què faries, i després la veus pas a pas.</p></section>
    ${PLAYS.map(p => `<button class="lesson" data-play="${p.id}" type="button"><span><b>${esc(p.name)}</b><span class="note">${esc(LBY[p.l]?.name || "")}${done[p.id] != null ? (done[p.id] ? " · encertada" : " · fallada") : ""}</span></span></button>`).join("")}`;
}
function viewPlay(){
  const p = play.p;
  return `<button class="btn ghost" data-back="1" type="button">‹ Tornar</button>
    <section class="card"><p class="note">${esc(LBY[p.l]?.name || "")}</p><h2>${esc(p.name)}</h2>
      <div class="mapbox big">${playSVG(p)}</div>
      ${play.ans == null ? `<p><b>${esc(p.q)}</b></p>${p.o.map((o, i) => `<button class="opt" data-pans="${i}" type="button">${esc(o)}</button>`).join("")}`
        : `<p class="${play.ans === p.a ? "good" : "bad"}"><b>${play.ans === p.a ? "Correcte." : "No: mira com es fa."}</b></p>
          <p id="pcap" class="why"></p>
          <div class="row"><button class="btn ghost" id="pprev" type="button">‹</button><span class="note" id="ppos"></span><button class="btn ghost" id="pnext" type="button">›</button><button class="btn" id="pplay" type="button">Reproduir</button></div>`}
    </section>`;
}
let playTimer = null;
function playGo(i){ play.i = Math.max(0, Math.min(play.p.steps.length - 1, i)); playDraw(play.p, play.i); }
// ---- views
let tab = get("tab", "you"), lessonOpen = null, round = null;
function setTab(t){ tab = t; lessonOpen = null; play = null; put("tab", t); render(); window.scrollTo(0, 0); }
function examplesFor(l){ return (prof?.ex || []).filter(e => PERSONAL[e.t]?.l === l); }
function viewYou(){ return installCard() + viewYou2(); }
function viewYou2(){
  if (code.length !== 8) return `<section class="card"><h2>Enllaça-ho amb el teu PC</h2>
    <p>Així les preguntes surten dels errors de les teves partides. A RiftMate, al PC, ves a <b>Coach › Estudia al mòbil</b> i escriu aquí el codi.</p>
    <form id="codeForm" class="row"><input id="codeIn" maxlength="9" placeholder="XXXX-XXXX" autocomplete="off" aria-label="Codi"><button class="btn" type="submit">Enllaçar</button></form>
    <p class="note">Sense codi també pots fer el curs i les preguntes generals.</p></section>` + viewLessonsList();
  if (!prof) return `<section class="card"><h2>Esperant les teves partides</h2><p>Encara no ha arribat el resum del PC. Obre RiftMate al PC (envia el resum sol uns minuts després d'obrir-lo i després de cada partida) i torna aquí.</p><button class="btn ghost" id="syncBtn" type="button">Tornar a mirar</button></section>` + viewLessonsList();
  const order = LESSONS.slice().sort((a, b) => (prof.score?.[b.id] ?? 0) - (prof.score?.[a.id] ?? 0));
  const kinds = Object.entries(prof.rate || {}).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const top = order[0];
  return `<section class="card"><p class="note">${prof.games} partides${prof.champ ? ` · sobretot ${esc(prof.champ)}` : ""} · ${ago(prof.at)}</p>
      <h2>Comença per: ${esc(top.name)}</h2><p>${esc(top.intro)}</p>
      <div class="row"><button class="btn" data-open="${top.id}" type="button">Obrir la lliçó</button><button class="btn ghost" data-quiz="1" type="button">8 preguntes</button></div></section>
    ${kinds.length ? `<section class="card"><h3>El que més es repeteix</h3><table>${kinds.map(([k, v]) => `<tr><td>${esc(KIND_NAME[k] || k)}</td><td class="n">${GAME_KINDS.includes(k) ? `${Math.round(v * 100)}% de les partides` : `${String(v).replace(".", ",")} per partida`}</td></tr>`).join("")}</table></section>` : ""}
    <h3>Les lliçons, per ordre d'importància per a tu</h3>${order.map(lessonBtn).join("")}`;
}
function lessonBtn(l){ const s = prof?.score?.[l.id]; const done = get("read", {})[l.id];
  return `<button class="lesson" data-open="${l.id}" type="button"><span><b>${esc(l.name)}</b><span class="note">${esc(l.short)}${done ? " · llegida" : ""}</span></span>
    ${s != null ? `<span class="meter"><span class="note">${s > 60 ? "molt" : s > 30 ? "força" : "poc"}</span><span class="bar ${s <= 30 ? "ok" : ""}"><i style="width:${Math.max(6, s)}%"></i></span></span>` : ""}</button>`; }
function viewLessonsList(){ return `<h3>Lliçons</h3>${LESSONS.map(lessonBtn).join("")}`; }
function viewLesson(l){
  const ex = examplesFor(l.id);
  const read = get("read", {}); read[l.id] = true; put("read", read);
  return `<button class="btn ghost" data-back="1" type="button">‹ Tornar</button>
    <section class="card"><h2>${esc(l.name)}</h2><p>${esc(l.intro)}</p><div class="mapbox">${mapSVG(l.map)}</div>
      ${l.sections.map(([h, t]) => `<h3>${esc(h)}</h3><p>${esc(t)}</p>`).join("")}
      <h3>Les claus</h3><ul class="rules">${l.rules.map(r => `<li>${esc(r)}</li>`).join("")}</ul>
      <h3>Errors típics</h3><ul class="rules">${l.errors.map(r => `<li>${esc(r)}</li>`).join("")}</ul></section>
    ${ex.length ? `<section class="card"><h3>A les teves partides</h3>${ex.map(e => `<div class="ex">${esc(PERSONAL[e.t].q(e).replace(/ (Què|Quin)[^?]*\?$/, ""))}</div>`).join("")}</section>` : ""}
    ${PLAYS.some(p => p.l === l.id) ? `<h3>Jugades d'aquesta lliçó</h3>${PLAYS.filter(p => p.l === l.id).map(p => `<button class="lesson" data-play="${p.id}" type="button"><span><b>${esc(p.name)}</b><span class="note">Al mapa, pas a pas</span></span></button>`).join("")}` : ""}
    <button class="btn" data-quiz="${l.id}" type="button">Preguntes d'aquesta lliçó</button>`;
}
function viewQuiz(){
  if (!round) {
    const due = allQuestions().filter(q => srs[q.id] && srs[q.id].due <= Date.now() && srs[q.id].b < 4).length;
    const seen = Object.keys(srs).length, total = allQuestions().length;
    return `<section class="card"><h2>Preguntes</h2><p>Rondes de 8: primer les que toca repassar, després les noves del teu nivell (les de les teves partides primer).</p>
      <div class="row" role="radiogroup" aria-label="Nivell">${[1, 2, 3].map(k => `<button class="btn ${k === lvl ? "" : "ghost"}" data-lvl="${k}" type="button" aria-pressed="${k === lvl}">${LVL_NAME[k]}</button>`).join("")}</div>
      <p class="note">El nivell canvia sol: si n'encertes 7 o 8, puja; si en falles més de la meitat, baixa.</p>
      <p class="note">${seen} de ${total} vistes · ${due} per repassar avui</p><button class="btn" data-quiz="1" type="button">Començar</button></section>`;
  }
  const q = round.qs[round.i], ans = round.ans;
  return `<section class="card"><p class="note">${round.i + 1} de ${round.qs.length} · ${esc(LBY[q.l]?.name || "")} · ${LVL_NAME[q.d || 1]}</p>${q.mine ? `<p class="mine">De les teves partides</p>` : ""}
    <h2>${esc(q.q)}</h2>${q.o.map((o, i) => `<button class="opt ${ans != null ? (i === q.a ? "right" : i === ans ? "wrong" : "") : ""}" data-ans="${i}" type="button" ${ans != null ? "disabled" : ""}>${esc(o)}</button>`).join("")}
    ${ans != null ? `<div class="why"><b>${ans === q.a ? "Correcte." : "No."}</b> ${esc(q.why)}</div><p><button class="btn" data-next="1" type="button">${round.i + 1 < round.qs.length ? "Següent" : "Acabar"}</button></p>` : ""}</section>`;
}
function render(){
  linkLabel();
  for (const [id, t] of [["tYou", "you"], ["tLessons", "lessons"], ["tPlays", "plays"], ["tQuiz", "quiz"]]) $("#" + id).setAttribute("aria-selected", tab === t);
  const v = $("#view");
  clearInterval(playTimer);
  v.innerHTML = play ? viewPlay() : lessonOpen ? viewLesson(LBY[lessonOpen]) : tab === "you" ? viewYou() : tab === "lessons" ? viewLessonsList() + sourcesHTML() : tab === "plays" ? viewPlays() : viewQuiz();
  if (play) playGo(play.ans == null ? 0 : play.i);
}
const sourcesHTML = () => `<section class="card sources note"><b>Fonts.</b> Els temps dels objectius són del pedaç 26.21; Riot els pot canviar. ${SOURCES.map(([t, u]) => `<a href="${u}" target="_blank" rel="noopener">${esc(t)}</a>`).join(" · ")}</section>`;
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.play) { play = {p: PLAYS.find(x => x.id === b.dataset.play), i: 0, ans: null}; render(); window.scrollTo(0, 0); }
  else if (b.dataset.pans != null && play) { play.ans = +b.dataset.pans; const d = get("playsDone", {}); d[play.p.id] = play.ans === play.p.a; put("playsDone", d); play.i = 0; render(); }
  else if (b.id === "pnext") { clearInterval(playTimer); playGo(play.i + 1); }
  else if (b.id === "pprev") { clearInterval(playTimer); playGo(play.i - 1); }
  else if (b.id === "pplay") { clearInterval(playTimer); playGo(0); playTimer = setInterval(() => { if (!play || play.i >= play.p.steps.length - 1) return clearInterval(playTimer); playGo(play.i + 1); }, 3200); }
  else if (b.dataset.open) { lessonOpen = b.dataset.open; play = null; render(); window.scrollTo(0, 0); }
  else if (b.dataset.back) { if (play) { play = null; } else lessonOpen = null; render(); }
  else if (b.dataset.quiz) { const l = b.dataset.quiz; let qs = l === "1" ? pickRound() : pickRound(8, l);
    round = {qs: qs.map(shuffle), i: 0, ok: 0, ans: null}; tab = "quiz"; lessonOpen = null; render(); window.scrollTo(0, 0); }
  else if (b.dataset.ans != null && round && round.ans == null) { const q = round.qs[round.i]; round.ans = +b.dataset.ans; const ok = round.ans === q.a; if (ok) round.ok++; grade(q.id, ok); render(); }
  else if (b.dataset.next) { round.i++; round.ans = null; if (round.i >= round.qs.length) { const ok = round.ok, n = round.qs.length; round = null; const lv = levelAfter(ok, n); $("#view").innerHTML = `<section class="card"><p class="big">${ok} / ${n}</p>${lv ? `<p>${lv}</p>` : ""}<p>Les que has fallat tornaran demà; les encertades, d'aquí a uns dies.</p><button class="btn" data-quiz="1" type="button">Una altra ronda</button></section>`; return; } render(); window.scrollTo(0, 0); }
  else if (b.dataset.lvl) { lvl = +b.dataset.lvl; put("lvl", lvl); render(); }
  else if (b.id === "installBtn" && installEvt) { installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; render(); }); }
  else if (b.id === "copyUrl") { navigator.clipboard?.writeText(location.href).then(() => { b.textContent = "Copiat"; }, () => {}); }
  else if (b.id === "installHide") { put("installHide", true); render(); }
  else if (b.id === "syncBtn") sync();
  else if (b.id === "linkBtn") { if (code.length === 8) linkPanel(); else { tab = "you"; lessonOpen = null; render(); } }
  else if (b.id === "unlink") { code = ""; prof = null; put("code", ""); put("prof", null); keepCodeInURL(); render(); }
});
function linkPanel(){ $("#view").innerHTML = `<section class="card"><h2>Enllaç amb el PC</h2><p>Codi <b>${code.slice(0, 4)}-${code.slice(4)}</b>${prof ? `: ${prof.games} partides, ${ago(prof.at)}` : ""}.</p><div class="row"><button class="btn ghost" id="syncBtn" type="button">Actualitzar</button><button class="btn ghost" id="unlink" type="button">Treure l'enllaç</button><button class="btn" data-back="1" type="button">Fet</button></div></section>`; }
document.addEventListener("submit", e => { e.preventDefault(); const v = ($("#codeIn")?.value || "").replace(/[^A-Za-z0-9]/g, "").toUpperCase(); if (v.length !== 8) { $("#codeIn").setCustomValidity("El codi té 8 lletres i números"); $("#codeIn").reportValidity(); return; } code = v; put("code", v); keepCodeInURL(); render(); sync(); });
$("#tPlays").onclick = () => setTab("plays"); $("#tYou").onclick = () => setTab("you"); $("#tLessons").onclick = () => setTab("lessons"); $("#tQuiz").onclick = () => setTab("quiz");
render(); sync();
document.addEventListener("visibilitychange", () => { if (!document.hidden) sync(); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
